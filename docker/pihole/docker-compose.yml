version: "3"

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    network_mode: "host"
    cap_add:
    - NET_ADMIN
    - NET_RAW
    environment:
      TZ: 'Asia/Bahrain'
      FTLCONF_webserver_api_password: ''
      FTLCONF_webserver_port: '8080'
    volumes:
      - './etc-pihole:/etc-pihole'
      - './etc-dnsmasq.d:/etc-dnsmasq.d'
    restart: unless-stopped
